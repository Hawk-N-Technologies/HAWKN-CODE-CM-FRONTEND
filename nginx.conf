server {
    listen 443 ssl;
    server_name clientportal.hawkntechnologies.com;

    # Keep your existing SSL certificate configuration here

    location /api/ {
        proxy_pass https://clientportalapi.hawkntechnologies.com;

        proxy_http_version 1.1;
        proxy_ssl_server_name on;

        proxy_set_header Host clientportalapi.hawkntechnologies.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
    }

    location /uploads/ {
        proxy_pass https://clientportalapi.hawkntechnologies.com;

        proxy_ssl_server_name on;
        proxy_set_header Host clientportalapi.hawkntechnologies.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}