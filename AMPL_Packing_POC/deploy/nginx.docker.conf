server {
    listen 18001;
    server_name ampl-poc.hawkntechnologies.com localhost;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2m;

    # Forward API requests to backend API
    location ~ ^/(api|admin)/ {
        proxy_pass https://ampl-pocapi.hawkntechnologies.com;
        proxy_set_header Host ampl-pocapi.hawkntechnologies.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_read_timeout 60s;
    }

    # Built JS/CSS files with hashes
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA client-side routing fallback
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
